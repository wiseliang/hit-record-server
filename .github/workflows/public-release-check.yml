name: Public release verification
on:
  push:
    branches: [ops/public-release-verification]
  workflow_dispatch:
jobs:
  public:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/verify-public-release.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-release-proof
          path: .qa/results/
          retention-days: 7
